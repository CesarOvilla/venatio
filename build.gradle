plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'venatio' }

repositories {
	maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' }
	// Solo para pruebas: Carpet crea jugadores simulados (/player Bot spawn), como el BingoCam del server viejo
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"venatio" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		server { runDir = 'run/server' }
		client { runDir = 'run/client' }
	}
}

// Pruebas automáticas con un cliente real: ./gradlew runClientGameTest (abre una ventana de Minecraft)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "venatio-pruebas"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mundos por partida; va dentro del jar (jar-in-jar)
	implementation include("xyz.nucleoid:fantasy:${project.fantasy_version}")

	// Jugadores simulados para las pruebas con varios equipos; no va en el jar del mod
	gametestRuntimeOnly "maven.modrinth:carpet:${project.carpet_version}"

	// Mods de rendimiento del cliente (los que instala el instalador). Para probar que no rompen el HUD de Venatio:
	// ./gradlew runClientGameTest -Pcliente=1   (o tools/prueba.sh con ORG_GRADLE_PROJECT_cliente=1)
	if (project.hasProperty('cliente')) {
		file('instalador/mods-cliente.txt').readLines()
			.findAll { it.trim() && !it.startsWith('#') && !it.startsWith('fabric-api ') }
			// Dynamic FPS baja los cuadros cuando la ventana no tiene el foco (la de prueba nunca lo tiene) y el HUD deja de
			// redibujarse entre pasos: se instala a los jugadores, pero no entra en las pruebas automáticas.
			.findAll { !it.startsWith('dynamic-fps ') }
			.each {
				def c = it.trim().split(/\s+/)
				// El id de la versión de Modrinth es exacto; el número puede repetirse entre versiones de Minecraft.
				gametestRuntimeOnly "maven.modrinth:${c[0]}:${c.size() > 2 ? c[2] : c[1]}"
			}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }

	// Textos: cada módulo tiene su es_mx.json en assets/<namespace>/lang/. Se copia como en_us y es_es
	// para que todo salga en español aunque el jugador tenga el juego en otro idioma.
	["en_us", "es_es"].each { idioma ->
		from("src/main/resources/assets") {
			include "*/lang/es_mx.json"
			into "assets"
			rename { "${idioma}.json" }
		}
	}
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
