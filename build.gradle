plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'venatio' }

repositories {
	maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' }
	// Solo para pruebas: Carpet crea jugadores simulados (/player Bot spawn), como el BingoCam del server viejo
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"venatio" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		server { runDir = 'run/server' }
		client { runDir = 'run/client' }
	}
}

// Pruebas automáticas con un cliente real: ./gradlew runClientGameTest (abre una ventana de Minecraft)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "venatio-pruebas"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// ---------------------------------------------------------------- medición de rendimiento (docs/RENDIMIENTO.md)
// Conjunto de mods de servidor que se agrega SOLO al runtime de las pruebas con cliente:
//   ./gradlew runClientGameTest -Pmods=a          (o con tools/prueba.sh: ORG_GRADLE_PROJECT_mods=a tools/prueba.sh …)
// Se pueden sumar conjuntos y mods sueltos con "+": -Pmods=a+spark, -Pmods=b+vmp. Sin -Pmods: base (solo Fabric API).
def modsServidor = [
	lithium    : 'maven.modrinth:lithium:mc26.3-0.26.4-fabric',
	ferritecore: 'maven.modrinth:ferrite-core:9.0.0-fabric',
	krypton    : 'maven.modrinth:krypton:0.3.2',
	scalablelux: 'maven.modrinth:scalablelux:0.3.0-alpha.0.6+26.3',
	c2me       : 'maven.modrinth:c2me-fabric:0.4.2-alpha.0.121+26.3',
	moonrise   : 'maven.modrinth:moonrise-opt:1.2.2+35bacce',
	vmp        : 'maven.modrinth:vmp-fabric:0.2.0+beta.7.238+26.3',
	servercore : 'maven.modrinth:servercore:YNdFPSov', // 1.5.21+26.3; por id porque el número de versión baja el jar de NeoForge
	chunky     : 'maven.modrinth:chunky:86FKD9qx',     // 1.5.66; ídem (el número de versión baja el de Sponge)
	dh         : 'maven.modrinth:distanthorizons:3.3.4-26.3',
	spark      : 'maven.modrinth:spark:1.10.187-fabric',
]
def conjuntosServidor = [
	base      : [],
	a         : ['lithium', 'ferritecore', 'krypton', 'scalablelux', 'c2me'],
	a_sin_c2me: ['lithium', 'ferritecore', 'krypton', 'scalablelux'],
	// Moonrise declara incompatibles C2ME, Starlight y ScalableLux (trae su propio motor de luz)
	b         : ['moonrise', 'lithium', 'ferritecore', 'krypton'],
]
def modsPedidos = providers.gradleProperty('mods').getOrElse('base')
def modsElegidos = modsPedidos.split('\\+').collectMany { t -> conjuntosServidor.containsKey(t) ? conjuntosServidor[t] : [t] }.unique()
modsElegidos.each { if (!modsServidor.containsKey(it)) throw new GradleException("Mod desconocido en -Pmods: ${it} (conocidos: ${modsServidor.keySet()})") }

// Parámetros de PruebaRendimiento sin recompilar: -PrendVistas=10,12,16 → -Dvenatio.rend.vistas=10,12,16 (ver la clase).
// -Pnucleos=3 limita los hilos que ve la JVM (-XX:ActiveProcessorCount); -Pmemoria=6G fija -Xmx; -Pjfr=archivo graba con JFR;
// -PjvmExtra='-XX:+UseCompactObjectHeaders …' agrega banderas de JVM (separadas por espacios);
// -PconfigMods=<carpeta> copia esa carpeta a config/ del juego de prueba (la carpeta de la corrida se borra cada vez).
def propiedadesRend = providers.gradlePropertiesPrefixedBy('rend').get()
def nucleos = providers.gradleProperty('nucleos').orNull
def memoria = providers.gradleProperty('memoria').orNull
def jfr = providers.gradleProperty('jfr').orNull
def jvmExtra = providers.gradleProperty('jvmExtra').orNull
def configMods = providers.gradleProperty('configMods').orNull

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mundos por partida; va dentro del jar (jar-in-jar)
	implementation include("xyz.nucleoid:fantasy:${project.fantasy_version}")

	// Jugadores simulados para las pruebas con varios equipos; no va en el jar del mod
	gametestRuntimeOnly "maven.modrinth:carpet:${project.carpet_version}"

	// Mods de rendimiento del cliente (los que instala el instalador). Para probar que no rompen el HUD de Venatio:
	// ./gradlew runClientGameTest -Pcliente=1   (o tools/prueba.sh con ORG_GRADLE_PROJECT_cliente=1)
	if (project.hasProperty('cliente')) {
		file('instalador/mods-cliente.txt').readLines()
			.findAll { it.trim() && !it.startsWith('#') && !it.startsWith('fabric-api ') }
			// Dynamic FPS baja los cuadros cuando la ventana no tiene el foco (la de prueba nunca lo tiene) y el HUD deja de
			// redibujarse entre pasos: se instala a los jugadores, pero no entra en las pruebas automáticas.
			.findAll { !it.startsWith('dynamic-fps ') }
			.each {
				def c = it.trim().split(/\s+/)
				// El id de la versión de Modrinth es exacto; el número puede repetirse entre versiones de Minecraft.
				gametestRuntimeOnly "maven.modrinth:${c[0]}:${c.size() > 2 ? c[2] : c[1]}"
			}
	}

	// Mods de servidor elegidos con -Pmods (ver arriba); solo en las pruebas, nunca en el jar
	modsElegidos.each { gametestRuntimeOnly modsServidor[it] }
}

tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	systemProperty 'venatio.rend.conjunto', modsPedidos
	propiedadesRend.each { k, v -> systemProperty 'venatio.rend.' + k.substring(4).uncapitalize(), v }
	if (nucleos) jvmArgs "-XX:ActiveProcessorCount=${nucleos}"
	if (memoria) jvmArgs "-Xmx${memoria}", "-Xms${memoria}"
	if (jfr) jvmArgs "-XX:StartFlightRecording=filename=${jfr},settings=profile,dumponexit=true"
	if (jvmExtra) jvmArgs jvmExtra.trim().split(/\s+/)
	if (jvmExtra) systemProperty 'venatio.rend.jvm', jvmExtra.trim()
	if (configMods) {
		def origen = file(configMods)
		def destino = file('build/run/clientGameTest/config')
		doFirst {
			destino.mkdirs()
			origen.eachFile { f -> java.nio.file.Files.copy(f.toPath(), destino.toPath().resolve(f.name), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }

	// Textos: cada módulo tiene su es_mx.json en assets/<namespace>/lang/. Se copia como en_us y es_es
	// para que todo salga en español aunque el jugador tenga el juego en otro idioma.
	["en_us", "es_es"].each { idioma ->
		from("src/main/resources/assets") {
			include "*/lang/es_mx.json"
			into "assets"
			rename { "${idioma}.json" }
		}
	}
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
